# not actually YAML but lets pretend:
# -*- mode: yaml -*-
# vim: ft=yaml:
#
# SALS Edge hardened config. Pair with the docker-compose.yml in this folder.

[global]
  e2dsa            # file indexing + filesystem scanning (upload-undo, search, dedup)
  e2ts             # multimedia tag indexing
  ansi             # colored logs
  hist: /cfg/hists/  # keep .hist (index/thumbs) in the config folder, not in the share

  df: 16           # refuse uploads when < 16 GB free
  ver              # show version in the control panel
  no-robots, force-js  # discourage search-engine crawling

  # We are behind Nginx terminating TLS. Trust the proxy's forwarded headers
  # so logs/ratelimits see the real client IP. Set to your proxy's IP/subnet.
  xff-src: 127.0.0.1

  # Source-IP allowlist. Uncomment and scope to what this service is for:
  # ipa: lan            # LAN only, reject internet
  # ipa: 10.89.         # only 10.89.*
  # ipa: 172.16.4.0/23  # only these subnets

  # Version vulnerability warnings — enable one, then panic-exit if vulnerable:
  vc-url: https://api.copyparty.eu/advisories
  vc-exit


[accounts]
  # username: password  — CHANGE THESE. Prefer long random strings; rotate per partner.
  admin: CHANGE_ME_admin
  partner: CHANGE_ME_partner


# --- volumes ---
# Example: a partner-facing drop folder. Partners get write-only-ish access,
# admin gets full control. Adjust per use case.

[/incoming]              # web path
  /w/incoming            # filesystem path inside the /w docker volume
  accs:
    w: partner           # partner can upload but not browse/download others' files
    rwmda: admin         # admin: read-write-move-delete-admin
  flags:
    e2ds                 # index this volume
    # nodupe             # reject duplicate uploads instead of dedup-linking
    # lifetime: 604800   # self-destruct uploads after 7 days (seconds)
